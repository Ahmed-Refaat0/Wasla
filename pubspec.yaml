name: wasla
description: Arabic-first local file sharing app.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bonsoir: ^7.1.6
  desktop_drop: 0.6.1
  file_picker: ^13.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  cryptography: 2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
