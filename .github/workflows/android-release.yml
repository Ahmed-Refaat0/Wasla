name: Wasla release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Package Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Wasla-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Wasla-Android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows application
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "Wasla-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Wasla-Windows-x64.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes

      - name: Upload release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "windows-release/Wasla-Windows-x64.zip" \
            "android-release/Wasla-Android.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
